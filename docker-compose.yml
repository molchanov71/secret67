services:
    db:
        image: postgres:17
        container_name: secret67-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
            POSTGRES_DB: secret67
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U admin -d secret67"]
            interval: 5s
            retries: 5
volumes:
    pgdata:

networks:
    default:
        ipam:
            config:
                - subnet: 172.30.0.0/24
